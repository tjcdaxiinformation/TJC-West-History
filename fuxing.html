```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復興小區 史料收集</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-base {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            background-color: white;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            width: 100%;
        }
        .btn-base:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .status-pill {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .status-pending { background-color: #f1f5f9; color: #64748b; }
        .status-done { background-color: #dcfce7; color: #166534; }
    </style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">復興小區 - 史料收集</h1>
        <div id="church-container" class="space-y-3"></div>
    </div>

    <script>
        // 依照 CSV 修正後的復興小區教會清單
        const churchList = [
            "八德", "崎頂", "大溪", "復興", "霞雲", 
            "義盛", "卡普", "大灣", "奎輝", "雪霧鬧", 
            "上巴陵", "中巴陵", "三光", "光華", "爺亨"
        ];

        function renderList() {
            const container = document.getElementById('church-container');
            container.innerHTML = '';
            
            churchList.forEach(name => {
                const isDone = localStorage.getItem(`fuxing_${name}`) === 'true';
                const btn = document.createElement('button');
                btn.className = 'btn-base';
                btn.innerHTML = `
                    <span class="font-semibold text-gray-700">${name}教會</span>
                    <span class="status-pill ${isDone ? 'status-done' : 'status-pending'}">
                        ${isDone ? '已完成' : '未完成'}
                    </span>
                `;
                btn.onclick = () => {
                    const url = `https://docs.google.com/forms/d/e/1FAIpQLScJonO-Dyv_nu_iLnms_gIswddQIN8THuuFfalLoHivc76W2Q/viewform?entry.974815491=${encodeURIComponent(name)}`;
                    window.open(url, '_blank');
                    localStorage.setItem(`fuxing_${name}`, 'true');
                    setTimeout(renderList, 500);
                };
                container.appendChild(btn);
            });
        }
        renderList();
    </script>
</body>
</html>
